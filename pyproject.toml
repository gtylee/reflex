[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "reflex-intelligence"
version = "0.1.0"
description = "REFLEX event-driven intelligence and discovery framework"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "duckdb>=1.2,<2",
  "joblib>=1.4",
  "numpy>=1.26",
  "pydantic>=2.10,<3",
  "pyarrow>=18",
  "scikit-learn>=1.5,<2",
  "torch>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.entry-points."reflex_intelligence.functions"]
portfolio-news = "reflex.experiments.portfolio_functions:portfolio_functions"

[project.scripts]
reflex = "reflex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reflex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
